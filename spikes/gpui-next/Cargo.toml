# SPIKE: mirin-metal built against current upstream GPUI (the zed repository's
# crates/gpui*, at the commit in fetch-zed.sh) instead of mirin's fork of gpui 0.2.2.
# See README.md and docs/metal/gpui-next.md. Not part of any workspace or default build.
[package]
name = "mirin-metal"
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT"
publish = false

# `exclude` makes cargo look for the upstream crates' own workspace root (zed/Cargo.toml),
# which their `workspace = true` fields inherit from.
[workspace]
exclude = ["zed"]

[dependencies]
gpui = { path = "zed/crates/gpui", default-features = false, features = ["wayland", "x11"] }
gpui_platform = { path = "zed/crates/gpui_platform", default-features = false, features = ["wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
# The spike host prints GPUI's log lines (`MIRIN_METAL_GPUI_LOG=1`); already in the tree.
log = "0.4"
accesskit = "0.25"
pprof = { version = "0.15", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
ash = "0.38"
accesskit_unix = "0.24"

[dev-dependencies]
gpui = { path = "zed/crates/gpui", default-features = false, features = ["test-support"] }

[features]
profiling = ["dep:pprof"]

# zed's workspace patches do not reach a dependent outside its workspace: the ones
# GPUI's crates need are repeated here (zed/Cargo.toml, [patch.crates-io]).
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
# mirin's accesskit_unix fork, as crates/mirin-metal uses it.
accesskit_unix = { path = "../../forks/accesskit_unix" }

[profile.dev.package."*"]
opt-level = 3

[[bin]]
name = "mirin-metal-host"
path = "src/bin/host.rs"
