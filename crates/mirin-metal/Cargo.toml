# Alpha crate, intentionally excluded from the root workspace (see the root
# Cargo.toml `exclude`): gpui's dependency tree is large and its platform
# requirements (Vulkan on Linux, Metal on macOS, DirectX on Windows) differ from
# the CEF core's. Build it standalone: `cargo build` from this directory. CI's
# `metal` job (.github/workflows/ci.yml) checks it on its own.
[package]
name = "mirin-metal"
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT"
publish = false
description = "mirin metal (alpha): GPU-rendered native UI for mirin apps, built on GPUI"

[dependencies]
# The engine: Zed's GPUI, forked (forks/zed; becoming sumi, docs/metal/engine.md).
gpui = { path = "../../forks/zed/crates/gpui", default-features = false, features = ["wayland", "x11"] }
gpui_platform = { path = "../../forks/zed/crates/gpui_platform", default-features = false, features = ["wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Async channel that wakes the window when the driver sends (already in gpui's tree).
futures = "0.3"
# The GPUI fork's startup milestones in the trace (src/trace.rs; already in gpui's tree).
log = "0.4"
# The accessibility tree (src/access/): AccessKit's tree types, everywhere.
accesskit = "0.25"
# Opt-in sampling profiler for the host (`--features profiling`); see
# `MIRIN_METAL_PROFILE` in src/bin/host.rs. Not part of normal builds.
pprof = { version = "0.15", optional = true }

# Ask the Wayland compositor which GPU it composites on (src/gpu.rs). Both are
# already in gpui's dependency tree.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
# The shell.toplevels capability (src/toplevels.rs); the version the engine
# already builds.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Probe that the chosen GPU's Vulkan driver has a device (src/gpu.rs); the
# version wgpu already builds.
ash = "0.38"
# Publish the accessibility tree over AT-SPI (src/access/linux.rs), so Orca
# reads Metal's UI; on zbus 5, which gpui's tree already builds.
accesskit_unix = "0.24"

# GPUI's test platform (a window with no GPU, a monospace stand-in for the
# text system), for tests that lay elements out (src/render/tests.rs).
[dev-dependencies]
gpui = { path = "../../forks/zed/crates/gpui", default-features = false, features = ["test-support"] }
# AccessKit's own tree (already built: the Unix adapter uses it), so the
# accessibility tests hand it every update as the adapter would.
accesskit_consumer = "0.39"

[features]
profiling = ["dep:pprof"]

# mirin's forks (forks/README.md), each with its changes in a MIRIN.md.
# zed's workspace patches do not reach a dependent outside its workspace: the
# ones GPUI's crates need are repeated here (forks/zed/Cargo.toml,
# [patch.crates-io]); keep them in step with it.
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
taffy = { path = "../../forks/taffy-next" }
accesskit_unix = { path = "../../forks/accesskit_unix" }
accesskit_atspi_common = { path = "../../forks/accesskit_atspi_common" }
accesskit_consumer = { path = "../../forks/accesskit_consumer" }
gpu-allocator = { path = "../../forks/gpu-allocator" }

# wgpu-hal alone of the wgpu repository (forks/wgpu/MIRIN.md): fewer command
# buffers and smaller memory blocks, for a small app's GPU memory.
[patch."https://github.com/gfx-rs/wgpu"]
wgpu-hal = { path = "../../forks/wgpu/wgpu-hal" }

# GPUI, taffy, and the text stack are unusably slow unoptimized; optimize
# dependencies in dev builds too (this crate itself stays fast to compile).
[profile.dev.package."*"]
opt-level = 3

[[example]]
name = "hello"

[[example]]
name = "counter"

[[bin]]
name = "mirin-metal-host"
path = "src/bin/host.rs"
