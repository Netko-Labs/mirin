[package]
name = "mirin-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# M1 smoke test: boots CEF and opens a mirin-owned NSWindow without Bun.
# Temporary derisking binary; the real entry is the Bun host calling mirin_run via FFI.
[[bin]]
name = "m1-smoke"
path = "src/bin/m1_smoke.rs"

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]

[dependencies]
cef.workspace = true
serde.workspace = true
serde_json.workspace = true
# Updater codec (delta patches): zstd compression + binary bsdiff/bspatch.
zstd = { version = "0.13", features = ["zstdmt"] }
qbsdiff = "1.4"
notify-rust = "4.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSUserInterfaceValidation",
    "NSView",
    "NSWindow",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSCell",
    "NSRunningApplication",
    "objc2-core-foundation",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSButton",
    "NSControl",
    "NSImage",
    "NSPasteboard",
    "NSAlert",
    "NSPanel",
    "NSSavePanel",
    "NSOpenPanel",
    "NSColor",
    "NSScreen",
    "NSVisualEffectView",
    "NSGlassEffectView",
] }
objc2-core-foundation = { workspace = true, features = ["CFData"] }
objc2-core-graphics = { workspace = true, features = [
    "CGImage",
    "CGColorSpace",
    "CGDataProvider",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

# Linux runs CEF on X11 (Ozone X11, incl. XWayland — Electrobun's approach). A
# frameless Views window has no WM move/resize/caption, so mirin drives those with
# `_NET_WM_MOVERESIZE` / window state via Xlib (x11-dl dlopens libX11 — no build-time
# X11 dev libs needed), against the CEF window's XID (`Window::window_handle`).
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"
# Decode the app-icon PNG to ARGB for the window's `_NET_WM_ICON` (taskbar/dock).
png = "0.17"
