[package]
name = "mirin-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# M1 smoke test: boots CEF and opens a mirin-owned NSWindow without Bun.
# Temporary derisking binary; the real entry is the Bun host calling mirin_run via FFI.
[[bin]]
name = "m1-smoke"
path = "src/bin/m1_smoke.rs"

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]

[dependencies]
cef.workspace = true
serde.workspace = true
serde_json.workspace = true
# Updater codec (delta patches), shared with the standalone release helper.
mirin-codec = { path = "../mirin-codec" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit = { workspace = true, features = [
    "NSApplication",
    "NSEvent",
    "NSResponder",
    "NSUserInterfaceValidation",
    "NSView",
    "NSWindow",
    "NSGraphics",
    "NSMenu",
    "NSMenuItem",
    "NSCell",
    "NSRunningApplication",
    "objc2-core-foundation",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSButton",
    "NSControl",
    "NSImage",
    "NSPasteboard",
    "NSAlert",
    "NSPanel",
    "NSSavePanel",
    "NSOpenPanel",
    "NSColor",
    "NSScreen",
    "NSVisualEffectView",
    "NSGlassEffectView",
] }
objc2-core-foundation = { workspace = true, features = ["CFData"] }
objc2-core-graphics = { workspace = true, features = [
    "CGImage",
    "CGColorSpace",
    "CGDataProvider",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

# Notifications on macOS and Windows. Without its default features notify-rust
# leaves out its Linux backends (zbus 5, whose zvariant crates are unmaintained);
# Linux speaks to the notification service itself (linux/notification.rs).
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
notify-rust = { version = "4.18", default-features = false }

# Linux runs CEF on X11 (Ozone X11, incl. XWayland — Electrobun's approach). A
# frameless Views window has no WM move/resize/caption, so mirin drives those with
# `_NET_WM_MOVERESIZE` / window state via Xlib (x11-dl dlopens libX11 — no build-time
# X11 dev libs needed), against the CEF window's XID (`Window::window_handle`).
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"
# Decode the app-icon PNG to ARGB for the window's `_NET_WM_ICON` (taskbar/dock).
png = "0.17"
# D-Bus, pure Rust: desktop notifications (org.freedesktop.Notifications) and
# file dialogs through xdg-desktop-portal, both blocking on a dialog thread.
zbus = { version = "6.2", default-features = false, features = ["default-rt", "proxy"] }
