name: CI

# Runner policy: **nothing here runs on Blacksmith — it bills, and CI does not.**
# This repository is public, so GitHub-hosted standard runners are free and cover
# every target this matrix needs. Blacksmith is reserved for the release builds in
# `release.yml`, which run only on a version tag; see the note there.
#
# The trade is deliberate: CI is slower than it was on paid hardware, and CI runs
# on every push. Paying per PR to shorten a job that already gates nothing urgent
# is the wrong side of that trade.
#
# Building on macOS 15 is fine even though Liquid Glass needs macOS 26 at runtime:
# NSGlassEffectView is resolved dynamically, not linked.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

# Newer pushes cancel in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: TypeScript lint/format
        run: bun run fmt-lint:ci

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Whitespace check
        run: git diff --check

  native:
    name: Native checks (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            install-build-tools: brew install ninja
          - name: Linux x64
            os: ubuntu-24.04
            install-build-tools: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
          - name: Linux arm64
            os: ubuntu-24.04-arm
            install-build-tools: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
          - name: Windows x64
            os: windows-2025
            install-build-tools: choco install ninja -y
          - name: Windows arm64
            os: windows-11-arm
            install-build-tools: choco install ninja -y
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.name }}

      - name: Install build tools
        run: ${{ matrix.install-build-tools }}

      - name: Cache CEF
        id: cef-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: vendor/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/mirin-core/Cargo.toml', 'crates/mirin-helper/Cargo.toml', 'scripts/fetch-cef.ts') }}

      - name: Fetch CEF
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: bun scripts/fetch-cef.ts

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build native
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test native workspace
        run: cargo test --workspace
        env:
          # cef-dll-sys copies libcef.so next to the built binaries, but only when
          # its build script actually runs. On a warm rust-cache the crate is fresh
          # so the script is skipped, while the copy itself is not part of what the
          # cache restores — leaving the test binary unable to load libcef.so
          # (`.cargo/config.toml` bakes an `$ORIGIN` rpath, and cargo adds the
          # target dir to the search path, but neither helps if the file is gone).
          # Point the loader at the distribution instead, which is true either way.
          # Inert on macOS (framework loader) and Windows (exe-dir search).
          LD_LIBRARY_PATH: ${{ github.workspace }}/vendor/cef

  security:
    name: Dependency security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Audit Bun dependencies
        run: bun audit

      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          arguments: --all-features
          command: check
          command-arguments: advisories
