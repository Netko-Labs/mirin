name: CI

# Runs on Blacksmith Linux, Windows, and Apple Silicon macOS runners. Requires
# the Blacksmith GitHub app installed on the Netko-Labs org (app.blacksmith.sh).
# Building on macOS 15 is fine even though Liquid Glass needs macOS 26 at runtime:
# NSGlassEffectView is resolved dynamically, not linked.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

# Newer pushes cancel in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    if: github.event_name != 'schedule'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: TypeScript lint/format
        run: bun run fmt-lint:ci

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Rust format check
        run: cargo fmt --all --check

      - name: Whitespace check
        run: git diff --check

  native:
    name: Native checks (${{ matrix.name }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: blacksmith-6vcpu-macos-15
            install-build-tools: brew install ninja
          - name: Linux x64
            os: blacksmith-4vcpu-ubuntu-2404
            install-build-tools: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
          - name: Linux arm64
            os: ubuntu-24.04-arm
            install-build-tools: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
          - name: Windows x64
            os: blacksmith-4vcpu-windows-2025
            install-build-tools: choco install ninja -y
          - name: Windows arm64
            os: windows-11-arm
            install-build-tools: choco install ninja -y
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.name }}

      - name: Install build tools
        run: ${{ matrix.install-build-tools }}

      - name: Cache CEF
        id: cef-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: vendor/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/mirin-core/Cargo.toml', 'crates/mirin-helper/Cargo.toml', 'scripts/fetch-cef.ts') }}

      - name: Fetch CEF
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: bun scripts/fetch-cef.ts

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build native
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test native workspace
        run: cargo test --workspace

      # Event-driven native UI validation: boot CEF with the GPU process enabled
      # (SwiftShader under Xvfb), require core.ready + window.created within the
      # timeout, then self-quit (crates/mirin-core/src/bin/m1_smoke.rs).
      - name: GPU UI smoke
        if: runner.os == 'Linux'
        env:
          MIRIN_SMOKE_VALIDATE: "1"
          MIRIN_SMOKE_TIMEOUT_MS: "60000"
          MIRIN_SMOKE_URL: "data:text/html,<h1>mirin gpu ui smoke</h1>"
        run: |
          sudo apt-get install -y xvfb
          cp vendor/cef/*.so vendor/cef/*.bin vendor/cef/*.pak vendor/cef/*.dat target/debug/
          cp vendor/cef/vk_swiftshader_icd.json vendor/cef/libvulkan.so.1 target/debug/
          cp -r vendor/cef/locales target/debug/
          xvfb-run -a target/debug/m1-smoke

  security:
    name: Dependency security
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Audit Bun dependencies
        run: bun audit

      - name: Audit Rust dependencies
        uses: EmbarkStudios/cargo-deny-action@bb137d7af7e4fb67e5f82a49c4fce4fad40782fe # v2
        with:
          arguments: --all-features
          command: check
          command-arguments: advisories
