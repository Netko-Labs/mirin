name: CI

# Runs on Blacksmith's Apple Silicon macOS runners. Requires the Blacksmith
# GitHub app installed on the Netko-Labs org (app.blacksmith.sh); Blacksmith is
# org-only. Building on macOS 15 is fine even though Liquid Glass needs macOS 26
# at runtime — NSGlassEffectView is resolved dynamically, not linked.

on:
  push:
    branches: [main]
  pull_request:

# Newer pushes cancel in-flight runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: blacksmith-6vcpu-macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Transparently backed by Blacksmith's colocated cache on their runners.
      - uses: Swatinem/rust-cache@v2

      - name: Install build tools
        run: brew install ninja

      - name: Cache CEF
        id: cef-cache
        uses: actions/cache@v4
        with:
          path: vendor/cef
          key: cef-${{ runner.os }}-${{ hashFiles('Cargo.toml') }}

      - name: Fetch CEF
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: bun scripts/fetch-cef.ts

      - name: Install deps
        run: bun install

      - name: Build native
        run: cargo build --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Typecheck
        run: bun run typecheck

      - name: Rust format check
        run: cargo fmt --all --check
