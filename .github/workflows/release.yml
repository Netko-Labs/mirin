name: Release

# A version tag from main creates an invisible draft first. Platform builds run
# concurrently, upload their CEF archives to that draft, and relay only small
# registry tarballs. Publication and release visibility happen after all targets
# succeed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14

jobs:
  prepare-release:
    name: Validate and create draft
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt

      - name: Validate release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION=$(bun -e 'console.log(require("./packages/mirin/package.json").version)')
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION"
            exit 1
          fi
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME does not point to a commit merged into main"
            exit 1
          fi
          VERSION="$VERSION" bun -e \
            'import { distTagForVersion } from "./scripts/lib/dist-tag.ts"; distTagForVersion(process.env.VERSION ?? "")'

      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Validate source
        run: |
          bun run fmt-lint:ci
          bun run typecheck
          bun run test
          cargo fmt --all --check

      - name: Create draft release
        id: create-release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          name: Mirin ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}

  build-macos:
    name: Build macOS arm64
    needs: prepare-release
    runs-on: blacksmith-6vcpu-macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install build tools
        run: brew install ninja

      - name: Cache CEF
        id: cef-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: vendor/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/mirin-core/Cargo.toml', 'crates/mirin-helper/Cargo.toml', 'scripts/fetch-cef.ts') }}

      - name: Fetch CEF
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: bun scripts/fetch-cef.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native release
        run: cargo build --release -p mirin-core -p mirin-helper

      - name: Stage native package and CEF archive
        run: |
          cp target/release/libmirin_core.dylib packages/native-darwin-arm64/
          cp target/release/mirin-helper packages/native-darwin-arm64/
          tar -czf cef-darwin-arm64.tar.gz -C vendor/cef "Chromium Embedded Framework.framework"
          bun scripts/write-sha256.ts cef-darwin-arm64.tar.gz

      - name: Smoke test native notification bridge
        env:
          DYLD_FRAMEWORK_PATH: ${{ github.workspace }}/vendor/cef
        run: bun scripts/smoke-notification.ts packages/native-darwin-arm64/libmirin_core.dylib

      - name: Pack registry packages
        run: bun scripts/pack-release.ts release-packages

      - name: Preserve packed packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages-macos
          path: release-packages/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload CEF to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" cef-darwin-arm64.tar.gz cef-darwin-arm64.tar.gz.sha256 --clobber

  build-windows:
    name: Build Windows ${{ matrix.arch }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: blacksmith-4vcpu-windows-2025
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install build tools
        run: choco install ninja -y

      - name: Cache CEF
        id: cef-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: vendor/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/mirin-core/Cargo.toml', 'crates/mirin-helper/Cargo.toml', 'scripts/fetch-cef.ts') }}

      - name: Fetch CEF
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: bun scripts/fetch-cef.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native release
        run: cargo build --release -p mirin-core -p mirin-helper

      - name: Stage native package and CEF archive
        shell: bash
        run: |
          cp target/release/mirin_core.dll packages/native-win32-${{ matrix.arch }}/
          cp target/release/mirin-helper.exe packages/native-win32-${{ matrix.arch }}/
          mkdir cef-dist
          cp vendor/cef/*.dll vendor/cef/*.bin vendor/cef/*.pak vendor/cef/*.dat cef-dist/
          cp vendor/cef/vk_swiftshader_icd.json cef-dist/
          cp -r vendor/cef/locales cef-dist/
          tar -czf cef-win32-${{ matrix.arch }}.tar.gz -C cef-dist .
          bun scripts/write-sha256.ts cef-win32-${{ matrix.arch }}.tar.gz

      - name: Smoke test native notification bridge
        shell: bash
        run: PATH="$PWD/vendor/cef:$PATH" bun scripts/smoke-notification.ts packages/native-win32-${{ matrix.arch }}/mirin_core.dll

      - name: Pack native registry package
        env:
          MIRIN_PACK_NATIVE_ONLY: "1"
        run: bun scripts/pack-release.ts release-packages

      - name: Preserve packed package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages-windows-${{ matrix.arch }}
          path: release-packages/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload CEF to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" cef-win32-${{ matrix.arch }}.tar.gz cef-win32-${{ matrix.arch }}.tar.gz.sha256 --clobber

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: blacksmith-4vcpu-ubuntu-2404
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Cache CEF
        id: cef-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: vendor/cef
          key: cef-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/mirin-core/Cargo.toml', 'crates/mirin-helper/Cargo.toml', 'scripts/fetch-cef.ts') }}

      - name: Fetch CEF
        if: steps.cef-cache.outputs.cache-hit != 'true'
        run: bun scripts/fetch-cef.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native release
        run: cargo build --release -p mirin-core -p mirin-helper

      - name: Stage native package and CEF archive
        run: |
          cp target/release/libmirin_core.so packages/native-linux-${{ matrix.arch }}/
          cp target/release/mirin-helper packages/native-linux-${{ matrix.arch }}/
          mkdir cef-dist
          cp vendor/cef/*.so vendor/cef/*.bin vendor/cef/*.pak vendor/cef/*.dat cef-dist/
          cp vendor/cef/vk_swiftshader_icd.json vendor/cef/libvulkan.so.1 vendor/cef/chrome-sandbox cef-dist/
          cp -r vendor/cef/locales cef-dist/
          tar -czf cef-linux-${{ matrix.arch }}.tar.gz -C cef-dist .
          bun scripts/write-sha256.ts cef-linux-${{ matrix.arch }}.tar.gz

      - name: Smoke test native notification bridge
        run: LD_LIBRARY_PATH="$PWD/vendor/cef:${LD_LIBRARY_PATH:-}" bun scripts/smoke-notification.ts packages/native-linux-${{ matrix.arch }}/libmirin_core.so

      - name: Pack native registry package
        env:
          MIRIN_PACK_NATIVE_ONLY: "1"
        run: bun scripts/pack-release.ts release-packages

      - name: Preserve packed package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-packages-linux-${{ matrix.arch }}
          path: release-packages/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload CEF to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" cef-linux-${{ matrix.arch }}.tar.gz cef-linux-${{ matrix.arch }}.tar.gz.sha256 --clobber

  publish-release:
    name: Publish registry packages and release
    needs: [prepare-release, build-macos, build-windows, build-linux]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Download packed packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-packages-*
          path: release-packages
          merge-multiple: true

      - name: Publish registry packages
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun scripts/publish-packed.ts release-packages

      - name: Publish GitHub release
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.prepare-release.outputs.release_id }},
              draft: false
            })
