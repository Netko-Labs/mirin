[package]
name = "sumi-wgpu"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/sumi_wgpu.rs"
doctest = false

[features]
default = []
font-kit = ["dep:font-kit"]
test-support = ["sumi/test-support", "dep:image"]

[dependencies]
sumi.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
collections.workspace = true
cosmic-text = "0.19.0"
etagere.workspace = true
itertools.workspace = true
image = { workspace = true, optional = true }
log.workspace = true
parking_lot.workspace = true
profiling.workspace = true
raw-window-handle.workspace = true
# mirin: COLRv1 colour glyphs (src/color_glyph.rs): skrifa reads the paint
# graph, tiny-skia draws it. The versions cosmic-text and resvg already build.
skrifa = "0.40"
smallvec.workspace = true
swash.workspace = true
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
# mirin: emoji presentation (src/emoji.rs); the version cosmic-text's
# dependencies already build.
unicode-properties = { version = "0.1", default-features = false, features = ["emoji"] }
sumi-util.workspace = true

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
# WARNING: If you change this, you must also publish a new version of zed-font-kit to crates.io
font-kit = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wgpu = { workspace = true, features = ["std", "metal", "gles", "vulkan", "wgsl"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
wgpu = { workspace = true, default-features = true }

[dev-dependencies]
image.workspace = true
# Validate shaders with the same Naga revision that wgpu uses at runtime.
naga = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007", features = ["wgsl-in"] }
