[package]
name = "sumi-platform"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/sumi_platform.rs"
doctest = false

[features]
default = ["multithreaded"]
# Threads in the browser: needs a nightly toolchain and a cross-origin-isolated
# page. Off, sumi-web builds on stable.
multithreaded = ["sumi-web/multithreaded"]
bench-support = ["sumi/bench-support", "sumi-macos/bench-support", "sumi-wgpu/bench-support"]
font-kit = ["sumi-macos/font-kit"]
inspector = ["sumi/inspector"]
test-support = ["sumi/test-support", "sumi-macos/test-support", "sumi-windows/test-support", "sumi-wgpu/test-support"]
screen-capture = ["sumi/screen-capture", "sumi-macos/screen-capture", "sumi-windows/screen-capture", "sumi-linux/screen-capture"]
runtime_shaders = ["sumi-macos/runtime_shaders", "sumi-ios/runtime_shaders"]
wayland = ["sumi-linux/wayland"]
x11 = ["sumi-linux/x11"]

[[bench]]
name = "atlas_upload"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "focus_cleanup"
path = "../sumi/benches/focus_cleanup.rs"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "inspector_render"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "randomized_element_tree"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "primitives"
harness = false
required-features = ["bench-support"]

[dependencies]
anyhow.workspace = true
sumi.workspace = true

[dev-dependencies]
bench_metrics.workspace = true
criterion.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sumi-macos.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
sumi-ios.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
sumi-windows.workspace = true
sumi = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(all(any(target_os = "linux", target_os = "freebsd"), not(target_env = "ohos")))'.dependencies]
sumi-linux.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
sumi-wgpu = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
sumi-web.workspace = true
console_error_panic_hook.workspace = true
