# sumi's workspace: the crates inherit their edition, dependencies and lints
# from here. It was the zed repository's root manifest, cut to what these
# crates use. crates/mirin-metal builds them by path (README.md).
[workspace]
resolver = "2"
members = [
    "crates/collections",
    "crates/refineable",
    "crates/refineable/derive_refineable",
    "crates/scheduler",
    "crates/sum_tree",
    "crates/sumi",
    "crates/sumi-apple",
    "crates/sumi-linux",
    "crates/sumi-macos",
    "crates/sumi-macros",
    "crates/sumi-platform",
    "crates/sumi-shared-string",
    "crates/sumi-util",
    "crates/sumi-wgpu",
    "crates/sumi-windows",
]

[workspace.package]
publish = false
edition = "2024"

[workspace.dependencies]

#
# The crates here
#

collections = { path = "crates/collections", version = "0.1.0" }
derive_refineable = { path = "crates/refineable/derive_refineable" }
sumi = { path = "crates/sumi", default-features = false }
sumi-apple = { path = "crates/sumi-apple" }
sumi-linux = { path = "crates/sumi-linux", default-features = false }
sumi-macos = { path = "crates/sumi-macos", default-features = false }
sumi-macros = { path = "crates/sumi-macros" }
sumi-platform = { path = "crates/sumi-platform", default-features = false }
sumi-shared-string = { path = "crates/sumi-shared-string" }
sumi-util = { path = "crates/sumi-util" }
sumi-wgpu = { path = "crates/sumi-wgpu" }
sumi-windows = { path = "crates/sumi-windows", default-features = false }
refineable = { path = "crates/refineable" }
scheduler = { path = "crates/scheduler" }
sum_tree = { path = "crates/sum_tree" }

#
# External crates
#

